services:
  backend:
    build:
      context: .
    volumes:
      - ./.env:/var/www/html/.env # <--- Añade este túnel
    env_file:
      - .env

  frontend:
    build:
      context: ./incoterms-frontend
    depends_on:
      - backend

  proxy-inverso:
    image: nginx:alpine
    container_name: proxy-inverso
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
